# Yarn 4 defaults to Plug'n'Play, which this repo cannot use: WXT/Vite, tsup, and the
# shipped MCP bundle are all executed by bare Node (`node mcp/dist/cli.js tools`, the
# postinstall `wxt prepare`, the esbuild run in scripts/check-intent.mjs) with no PnP
# loader in scope. node-modules keeps resolution ordinary.
nodeLinker: node-modules

# The release is vendored, not left to whatever `yarn` is on PATH. Yarn <=4.9 applies its
# builtin TypeScript compat patch unconditionally, and that patch is written against the
# old JS compiler layout (`lib/_tsc.js`) — TypeScript 7 is the native port and has no such
# file, so installing with an older Yarn dies in the fetch step. Any `yarn` new enough to
# read this file re-execs into the pinned one, so the version on PATH stops mattering.
yarnPath: .yarn/releases/yarn-4.17.1.cjs
