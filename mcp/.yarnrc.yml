# mcp/ is its own Yarn project, not a workspace of the root — it ships as a standalone npm
# package with its own node_modules (see CLAUDE.md), which is why `yarn install` at the root
# still does not cover it.
#
# What actually keeps the two apart is `mcp/yarn.lock`: Yarn picks a project root by walking
# up from the cwd and stopping at the first directory holding a lockfile. Delete that file
# and `yarn --cwd mcp` gets absorbed into the root install.
#
# `yarnPath` is inherited from the root .yarnrc.yml (path settings resolve against the file
# that declared them, so it still points at the vendored release). Only the linker is
# restated here, so the directory keeps resolving correctly if it is ever copied out.
nodeLinker: node-modules
