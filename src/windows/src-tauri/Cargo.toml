[package]
name = "browsentic-desktop"
version = "0.0.0"
edition = "2021"
publish = false

[[bin]]
name = "Browsentic"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
getrandom = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "~2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-deep-link = "~2.6"
tauri-plugin-opener = "~2.5"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-updater = { version = "~2.12", default-features = false, features = ["native-tls"] }
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt", "sync", "time"] }
tokio-tungstenite = "0.30"
url = "2"
zip = { version = "8", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Data_Xml_Dom", "UI_Notifications"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Environment", "Win32_UI_WindowsAndMessaging"] }
winreg = "0.56"

[dev-dependencies]
tempfile = "3"
