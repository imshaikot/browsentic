# The same gate CONTRIBUTING.md asks for locally, on every pull request — until now
# `yarn check` only ran inside the release workflow, so a community PR could land red.
#
# Install mirrors release.yml: Yarn is vendored at the path .yarnrc.yml pins, so nothing
# depends on whichever yarn the runner image ships, and src/daemon is a separate project
# with its own lockfile that the root install does not cover.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: |
          yarn_bin=$(sed -n 's/^yarnPath: *//p' .yarnrc.yml)
          test -f "$yarn_bin" || { echo "::error::no vendored Yarn at '$yarn_bin'"; exit 1; }
          echo "YARN=$yarn_bin" >> "$GITHUB_ENV"
          node "$yarn_bin" install --immutable
          node "$yarn_bin" --cwd src/daemon install --immutable

      - name: Check
        run: node "$YARN" check

      - name: Build both bundles
        # Type checks pass on code Vite still refuses to bundle; catch that here, not on a tag.
        run: |
          node "$YARN" build
          node "$YARN" daemon:build

      # The same commands the windows job runs, so one that behaves differently there fails there.
      - name: Run every command from the packed tarball
        run: |
          tarball="$(cd src/daemon && npm pack --silent | tail -1)"
          node src/daemon/scripts/cli-smoke.ts "src/daemon/$tarball"

  # The daemon and the CLI on Windows, where an npm-installed agent is a .cmd shim, a path has
  # backslashes, a kill takes nothing with it and a file has no POSIX mode. The extension's tests do
  # not reach the platform, so only the daemon project runs here.
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      # Recorded CLI output is read line by line, and a checkout that turned LF into CRLF would
      # hand every parser a stray carriage return.
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: |
          yarn_bin=$(sed -n 's/^yarnPath: *//p' .yarnrc.yml)
          test -f "$yarn_bin" || { echo "::error::no vendored Yarn at '$yarn_bin'"; exit 1; }
          echo "YARN=$yarn_bin" >> "$GITHUB_ENV"
          node "$yarn_bin" install --immutable
          node "$yarn_bin" --cwd src/daemon install --immutable

      - name: Type-check and bundle the daemon
        run: |
          node "$YARN" daemon:compile
          node "$YARN" daemon:build

      - name: Test the daemon
        run: node "$YARN" vitest run --project daemon

      # What a person types, from what npm installs: a .cmd shim, a wake-up launcher cmd.exe reads in
      # its own code page, the registry key Chrome finds that launcher by, and an MCP client starting
      # a .cmd, all under a home folder whose name is not ASCII.
      - name: Run every command from the packed tarball
        run: |
          node "$YARN" build
          tarball="$(cd src/daemon && npm pack --silent | tail -1)"
          node src/daemon/scripts/cli-smoke.ts "src/daemon/$tarball"

  mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Build and test the macOS app
        working-directory: src/mac
        run: |
          swift build
          swift test

  # The Windows app's Rust half, built and tested where it runs: the registry, the PATH, the job
  # object and the tray only compile on Windows. Its UI is type-checked and tested by `check`.
  windows-app:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/windows

      - name: Install dependencies
        run: |
          yarn_bin=$(sed -n 's/^yarnPath: *//p' .yarnrc.yml)
          echo "YARN=$yarn_bin" >> "$GITHUB_ENV"
          node "$yarn_bin" install --immutable

      # tauri-build refuses to compile while a bundled resource folder is missing; the payload itself
      # is staged only for an installer (scripts/windows-payload.ts), which the tests do not need.
      - name: Build the window the app embeds
        run: |
          node "$YARN" win:ui
          mkdir -p src/windows/src-tauri/resources/payload src/windows/src-tauri/resources/launcher

      - name: Build and test the app and its launcher
        working-directory: src/windows
        run: cargo test --workspace --locked
