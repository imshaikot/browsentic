# Cuts a GitHub release when a v* tag is pushed.
#
# The tag is both the trigger and the source of truth. CI bumps nothing and tags nothing:
# it rebuilds the tagged commit from scratch, checks the build agrees with the tag, and
# publishes the three store archives under a release of that name. So the whole local half
# of a release is "bump both package.json files, commit, tag vX.Y.Z, push the tag".
#
# Two properties this leans on:
#   - Both package.json files must already say X.Y.Z at the tagged commit. A mismatch fails
#     the run rather than shipping a zip whose filename disagrees with its manifest.
#   - An annotated tag's own message, if it has one, becomes the release notes verbatim.
#     Otherwise they are generated from the conventional-commit log since the previous tag.
#     Either way scripts/release-notes.mjs decides, and it runs the same locally.
#
# Anything that creates the release by hand (`gh release create` for the same tag) races
# this workflow, and whichever call lands second fails on an existing release.
#
# One gotcha: a tag push runs the workflow as it exists *in the tagged commit*, not as it
# exists on main. Re-tagging a commit from before this file was added therefore does
# nothing, and editing this workflow only takes effect from the next tag cut after it.

name: Release

on:
  push:
    tags: ['v*']

# The release step needs to write to the Releases API. id-token is what npm Trusted
# Publishing mints its short-lived credential from, so the publish step needs no secret at
# all and gets a provenance attestation for free.
permissions:
  contents: write
  id-token: write

# One tag at a time, and never cancel a run mid-upload: a half-uploaded release is worse
# than a slow queue.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Notes come from the commit log since the previous tag, so a shallow clone
          # would render an empty changelog rather than fail.
          fetch-depth: 0

      - name: Resolve the version and check both manifests agree with the tag
        # package.json is an output of `prepare`, not an input, so a mismatch means the tag
        # was cut by hand at the wrong commit. Catching it here beats shipping a zip whose
        # filename and manifest disagree with the release it hangs under.
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          if ! printf '%s' "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$tag' is not a vX.Y.Z tag"
            exit 1
          fi
          for file in package.json src/daemon/package.json; do
            found=$(node -p "require('./$file').version")
            if [ "$found" != "$version" ]; then
              echo "::error::$file says $found but the tag is $tag"
              exit 1
            fi
          done
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        # Yarn is vendored at the path .yarnrc.yml pins, so this does not depend on whichever
        # yarn the runner image ships (its classic 1.x cannot read yarnPath at all). Running
        # the release through node needs nothing but node. src/daemon is a separate project with its
        # own lockfile, so the root install does not cover it.
        run: |
          yarn_bin=$(sed -n 's/^yarnPath: *//p' .yarnrc.yml)
          test -f "$yarn_bin" || { echo "::error::no vendored Yarn at '$yarn_bin'"; exit 1; }
          echo "YARN=$yarn_bin" >> "$GITHUB_ENV"
          node "$yarn_bin" install --immutable
          node "$yarn_bin" --cwd src/daemon install --immutable

      - name: Check
        # The same gate the README asks for before a pull request: both type checks, the intent
        # fixtures and the security fixtures.
        run: node "$YARN" check

      - name: Build the store archives and the daemon
        # WXT reads the version out of package.json at build time, so it lands in the manifest
        # and in the zip filename. The firefox zip emits the sources zip as a side effect;
        # there is no separate command for it.
        run: |
          node "$YARN" zip
          node "$YARN" zip -b firefox
          node "$YARN" daemon:build

      - name: Verify the build carries the tagged version
        run: |
          built=$(node -p "require('./dist/chrome-mv3/manifest.json').version")
          if [ "$built" != "$VERSION" ]; then
            echo "::error::built manifest says $built, expected $VERSION"
            exit 1
          fi
          for asset in chrome firefox sources; do
            test -s "dist/browsentic-$VERSION-$asset.zip" || {
              echo "::error::missing artifact: dist/browsentic-$VERSION-$asset.zip"
              exit 1
            }
          done

      - name: Pack and smoke-test the npm tarball
        # `npm pack` runs src/daemon/scripts/stage-extension.mjs through prepack, so this exercises
        # the same path a maintainer gets locally. Everything below runs against the real
        # tarball rather than the working tree, and it runs before anything is published,
        # because an npm version cannot be taken back.
        run: |
          tarball="$(cd src/daemon && npm pack --silent)"
          echo "TARBALL=$GITHUB_WORKSPACE/src/daemon/$tarball" >> "$GITHUB_ENV"

          tar -tzf "src/daemon/$tarball" | grep -q 'package/extension/chrome-mv3/manifest.json' \
            || { echo "::error::the tarball carries no extension"; exit 1; }
          if tar -tzf "src/daemon/$tarball" | grep -q '\.map$'; then
            echo "::error::sourcemaps leaked into the tarball"; exit 1
          fi

          mkdir -p /tmp/smoke && cd /tmp/smoke && npm init -y >/dev/null
          npm i --no-audit --no-fund "$GITHUB_WORKSPACE/src/daemon/$tarball"

          # Zero runtime dependencies. This is the guard that catches someone moving a
          # package back into `dependencies` and quietly restoring the 33 MB install.
          deps=$(ls node_modules | grep -cv '^\.')
          test "$deps" -eq 1 || {
            echo "::error::expected 1 installed package, found $deps"; ls node_modules; exit 1
          }

          npx browsentic --version | grep -qx "$VERSION"
          npx browsentic tools | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const t=JSON.parse(s);if(!Array.isArray(t)||t.length<40)throw new Error("tool manifest looks wrong: "+t.length)})'

          export HOME=/tmp/smoke-home BROWSENTIC_HOME=/tmp/smoke-home/.browsentic
          mkdir -p "$HOME"
          npx browsentic setup --no-pair --json
          node -p "require('$HOME/browsentic/extension/chrome-mv3/manifest.json').version" | grep -qx "$VERSION"

          # The MCP handshake, on both entry points. Bare invocation of the legacy bin must
          # keep serving, and `browsentic mcp` must serve too: an agent run spawns the CLI
          # itself, so a regression here breaks every side-panel run silently.
          cat > /tmp/probe.cjs <<'PROBE'
          const { spawn } = require('child_process');
          const [, , bin, ...args] = process.argv;
          const p = spawn(bin, args, { stdio: ['pipe', 'pipe', 'inherit'] });
          let out = '';
          const finish = (code) => { try { p.kill('SIGKILL'); } catch {} process.exit(code); };
          p.stdout.on('data', (d) => { out += d; if (out.includes('serverInfo')) finish(0); });
          p.stdin.write(JSON.stringify({ jsonrpc: '2.0', id: 1, method: 'initialize', params: { protocolVersion: '2025-06-18', capabilities: {}, clientInfo: { name: 'smoke', version: '0' } } }) + '\n');
          setTimeout(() => { console.error('no serverInfo from ' + bin + ' ' + args.join(' ')); finish(1); }, 20000);
          PROBE
          node /tmp/probe.cjs ./node_modules/.bin/browsentic mcp \
            || { echo "::error::browsentic mcp did not answer initialize"; exit 1; }
          node /tmp/probe.cjs ./node_modules/.bin/browsentic-mcp \
            || { echo "::error::browsentic-mcp lost bare-invocation MCP serving"; exit 1; }

          npx browsentic stop || true

      - name: Release notes
        # Prefers the text `prepare` wrote into the annotated tag, and falls back to reading
        # the conventional-commit log when the tag carries none.
        run: node scripts/release-notes.mjs "$VERSION" --out "dist/RELEASE_NOTES-$TAG.md"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --verify-tag \
            --notes-file "dist/RELEASE_NOTES-$TAG.md" \
            "dist/browsentic-$VERSION-chrome.zip" \
            "dist/browsentic-$VERSION-firefox.zip" \
            "dist/browsentic-$VERSION-sources.zip"
          gh release view "$TAG" --json url -q '"released: " + .url' >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------------------
  # Publishing to npm is written but not enabled yet. Two things have to happen first, in
  # this order, and neither can be done from CI:
  #
  #   1. Publish one version by hand from a maintainer's machine. That claims the name and
  #      forces someone to install and run the real tarball once before any automation does.
  #   2. Configure the trusted publisher on npmjs.com for imshaikot/browsentic, workflow
  #      release.yml. That is what makes `npm publish` work here with no NODE_AUTH_TOKEN.
  #
  # Then delete the `if: false` below. Note that a tag runs this workflow as it existed at
  # the tagged commit, so the change takes effect from the next tag cut after it lands.
  #
  # This is deliberately the LAST step. A GitHub release can be deleted; an npm version
  # cannot — unpublish is restricted to 72 hours and burns the number permanently. Anything
  # that can still fail should have failed by now.
  # ---------------------------------------------------------------------------------------
      - name: Publish to npm
        if: false
        working-directory: src/daemon
        env:
          NPM_CONFIG_PROVENANCE: true
        run: |
          if npm view "browsentic@$VERSION" version >/dev/null 2>&1; then
            echo "browsentic@$VERSION is already on npm, skipping" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          npm publish
          echo "published: https://www.npmjs.com/package/browsentic/v/$VERSION" >> "$GITHUB_STEP_SUMMARY"
