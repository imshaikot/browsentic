# Publishes the redirect stub that retires the old GitHub Pages home.
#
# The site itself now lives at https://browsentic.com, deployed to Vercel from a
# developer machine (scripts/deploy.sh). Nothing about the real site is built here.
#
# This workflow exists only so that https://imshaikot.github.io/browsentic/ keeps
# answering: every page it serves carries rel=canonical pointing at browsentic.com
# and redirects there, preserving the path, so accumulated links transfer rather
# than splitting into a duplicate copy of the site.
#
# This file exists ONLY on the orphan `website` branch. `main` has no copy of it.

name: Publish redirect stub

on:
  push:
    branches: [website]
    paths:
      - 'pages-redirect/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to build from anywhere but the website branch
        run: |
          if [ "${{ github.ref_name }}" != "website" ]; then
            echo "::error::This workflow only builds the 'website' branch (got '${{ github.ref_name }}')."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Verify the stub redirects and carries a canonical
        run: |
          for f in index.html 404.html; do
            test -s "pages-redirect/$f" || { echo "::error::pages-redirect/$f missing"; exit 1; }
            grep -q 'browsentic.com' "pages-redirect/$f" || { echo "::error::$f does not point at browsentic.com"; exit 1; }
          done
          grep -q 'rel="canonical"' pages-redirect/index.html || { echo "::error::canonical missing"; exit 1; }

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-redirect

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
